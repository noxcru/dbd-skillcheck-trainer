<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBD Skill Check Trainer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="overlay"></div>

  <div class="container">

    <h1>DBD Skill Check Trainer</h1>

    <div class="stats">
      <div>Streak: <span id="streak">0</span></div>
      <div>Best: <span id="best">0</span></div>
      <div>Mode: <span id="modeText">Normal</span></div>
    </div>

    <div class="mode-buttons">
      <button onclick="setMode('easy')">Easy</button>
      <button onclick="setMode('normal')">Normal</button>
      <button onclick="setMode('hard')">Hard</button>
    </div>

    <div class="circle" id="circle">
      <div class="zone" id="zone"></div>
      <div class="pointer" id="pointer"></div>
    </div>

    <p id="result">Press SPACE when the pointer reaches the zone!</p>

    <button id="startBtn">Start Skill Check</button>

  </div>

  <script src="./script.js"></script>
</body>
</html>
