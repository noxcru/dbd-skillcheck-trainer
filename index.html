<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBD Skill Check Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-overlay"></div>

<div class="container">

  <h1>DBD Skill Check Trainer</h1>

  <div class="topbar">
    <div class="card">
      <span>Streak</span>
      <h2 id="streak">0</h2>
    </div>

    <div class="card">
      <span>Best</span>
      <h2 id="best">0</h2>
    </div>

    <div class="card">
      <span>Mode</span>
      <h2 id="modeText">Normal</h2>
    </div>
  </div>

  <div class="modes">
    <button onclick="setMode('easy')">Easy</button>
    <button onclick="setMode('normal')">Normal</button>
    <button onclick="setMode('hard')">Hard</button>
  </div>

  <div class="circle">

    <div class="good-zone" id="goodZone"></div>
    <div class="great-zone" id="greatZone"></div>

    <div class="pointer" id="pointer"></div>

    <div class="center-dot"></div>

  </div>

  <div id="popup" class="popup"></div>
  <div class="generator-wrap">
  <div class="generator-bar" id="generatorBar"></div>
</div>

<div class="combo" id="combo">x1 Combo</div>

  <button id="startBtn">Start Skill Check</button>

</div>

<script src="script.js"></script>
</body>
</html>
